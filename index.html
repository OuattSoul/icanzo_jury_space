                    { id: 'b', label: { fr: "Maquettes/Wireframes interactifs (Figma) sans logique fonctionnelle.", en: "Interactive wireframes/prototypes (Figma) without live logic." } },
                    { id: 'c', label: { fr: "MVP fonctionnel (No-code ou prototype) utilisable par bêta-testeurs.", en: "Functional MVP (No-code or prototype) usable by beta testers." } },
                    { id: 'd', label: { fr: "Produit robuste fonctionnant en réel avec utilisateurs actifs réguliers.", en: "Live product operating in real conditions with active, recurring users." } }
                ]
            },
            {
                id: 'tech_ready', name: 'Technology readiness', category: 'Technology readiness', type: 'radio',
                q: { fr: 'La technologie cœur fonctionne-t-elle de manière fiable ? Quels sont les risques techniques majeurs ?', en: 'Is the core technology working reliably? What are the main technical risks?' },
                options: [
                    { id: 'a', label: { fr: "La faisabilité technique n'a pas encore été prouvée.", en: "Technical feasibility remains unproven." } },
                    { id: 'b', label: { fr: "Architecture définie mais comportant de nombreux bugs et instabilités.", en: "Architecture defined, but unstable with significant bug risks." } },
                    { id: 'c', label: { fr: "Brique technique principale fonctionnelle en environnement contrôlé.", en: "Core technology working reliably in a controlled testing environment." } },
                    { id: 'd', label: { fr: "Infrastructure technique stable, sécurisée, évolutive et testée.", en: "Stable, secure, scalable, and stress-tested technical infrastructure." } }
                ]
            },
            {
                id: 'market_validation', name: 'Market validation', category: 'Market validation', type: 'radio',
                q: { fr: 'Combien d\'entretiens clients, de tests, de pilotes, d\'utilisateurs ou de transactions avez-vous réalisés ?', en: 'How many customer interviews, tests, pilots, users or transactions have you completed?' },
                options: [
                    { id: 'a', label: { fr: "Moins de 5 entretiens, aucune transaction ni test utilisateur.", en: "Fewer than 5 interviews; zero transactions or user tests." } },
                    { id: 'b', label: { fr: "10 à 20 entretiens qualitatifs mais pas de pilote payant/concret.", en: "10-20 qualitative interviews, but no concrete or paying pilot." } },
                    { id: 'c', label: { fr: "Plus de 30 entretiens, landing page testée ou premier pilote gratuit.", en: "30+ interviews completed, landing page tested, or active free pilot." } },
                    { id: 'd', label: { fr: "Pilotes payants validés, croissance d'utilisateurs ou ventes récurrentes.", en: "Validated paying pilots, active user growth, or recurring sales." } }
                ]
            },
            {
                id: 'business_model', name: 'Business model', category: 'Business model', type: 'checkbox',
                q: { fr: 'Comment le projet va-t-il générer et conserver de la valeur financière ?', en: 'How will the venture generate and retain value?' },
                options: [
                    { id: 'bm_1', label: { fr: "Modèle de revenus indéterminé ou dépendant de subventions.", en: "Undefined revenue model or sole reliance on ads/grants." } },
                    { id: 'bm_2', label: { fr: "Modèle choisi mais sans grille tarifaire ni logique de marges.", en: "Revenue stream chosen, but lacks pricing structure or margin logic." } },
                    { id: 'bm_3', label: { fr: "Grille tarifaire définie et alignée sur la valeur perçue du marché.", en: "Clear pricing structure defined and aligned with market value." } },
                    { id: 'bm_4', label: { fr: "Modèle économique testé en réel, récurrent, avec marges prévisibles.", en: "Live-tested, recurring business model with predictable margins." } }
                ]
            },
            {
                id: 'traction', name: 'Traction', category: 'Traction', type: 'radio',
                q: { fr: 'Qu\'est-ce qui a changé au niveau des utilisateurs, des revenus, des partenariats ou de\'usage du produit au cours des 90 derniers jours ?', en: 'What has changed in users, revenue, partnerships or product usage over the last 90 days?' },
                options: [
                    { id: 'a', label: { fr: "Stagnation complète au cours des 90 derniers jours.", en: "Complete stagnation over the last 90 days." } },
                    { id: 'b', label: { fr: "Progrès mineurs (ajustement du site, quelques inscrits newsletter).", en: "Minor progress (website tweaks, a few newsletter signups)." } },
                    { id: 'c', label: { fr: "Croissance visible des métriques clés (utilisateurs, partenariats).", en: "Visible growth in core metrics (users, engagement, signed partners)." } },
                    { id: 'd', label: { fr: "Forte accélération (croissance mensuelle à deux chiffres de l'usage/CA).", en: "Strong acceleration (double-digit MoM growth in revenue or usage)." } }
                ]
            },
            {
                id: 'team_capacity', name: 'Team capacity', category: 'Team capacity', type: 'checkbox',
                q: { fr: 'Quelles compétences critiques sont présentes dans l\'équipe et lesquelles manquent ?', en: 'Which critical skills are present and which are missing?' },
                options: [
                    { id: 'tc_1', label: { fr: "Lacunes majeures dans l'équipe sur le cœur de métier (ex: pas de Tech).", en: "Major skill gaps in core functions (e.g., no technical capability)." } },
                    { id: 'tc_2', label: { fr: "Équipe incomplète s'appuyant ponctuellement sur des prestataires.", en: "Incomplete team relying heavily on temporary external freelancers." } },
                    { id: 'tc_3', label: { fr: "Compétences essentielles (Tech + Produit/Business) couvertes en interne.", en: "Essential skills (Tech + Product or Business) covered in-house." } },
                    { id: 'tc_4', label: { fr: "Équipe pluridisciplinaire expérimentée et 100% autonome pour exécuter.", en: "Experienced, multi-disciplinary team fully autonomous in executing." } }
                ]
            },
            {
                id: 'financial_readiness', name: 'Financial readiness', category: 'Financial readiness', type: 'radio',
                q: { fr: 'Suivez-vous les coûts, les revenus, les besoins de trésorerie et l\'utilisation des fonds ?', en: 'Do you track costs, revenue, cash needs and use of funds?' },
                options: [
                    { id: 'a', label: { fr: "Pas de comptabilité, pas de suivi du compte bancaire ni trésorerie.", en: "No accounting, bank balance tracking, or future runway planning." } },
                    { id: 'b', label: { fr: "Suivi basique des factures sans tableau de bord financier.", en: "Basic invoice tracking without a financial dashboard." } },
                    { id: 'c', label: { fr: "Modèle financier établi avec projections de trésorerie sur 12 mois.", en: "Established financial model with a 12-month cash runway forecast." } },
                    { id: 'd', label: { fr: "Gestion professionnelle : plan d'affectation et de trésorerie maîtrisé.", en: "Professional financial management: capital allocation and cash flow control." } }
                ]
            },
            {
                id: 'legal_ip', name: 'Legal / IP', category: 'Legal / IP', type: 'radio',
                q: { fr: 'À qui appartient le produit/code/marque ? Existe-t-il des enjeux réglementaires ou de données ?', en: 'Who owns the product/code/brand? Are there regulatory or data issues?' },
                options: [
                    { id: 'a', label: { fr: "Statut juridique non créé, propriété code/marque floue ou non cédée.", en: "No legal entity; product/code/brand ownership unassigned or unclear." } },
                    { id: 'b', label: { fr: "Entreprise enregistrée mais statuts/accords d'associés basiques.", en: "Company incorporated, but basic cofounder agreements are unaligned." } },
                    { id: 'c', label: { fr: "Propriété intellectuelle sécurisée au nom de la société.", en: "Intellectual property fully assigned to the company; path mapped." } },
                    { id: 'd', label: { fr: "Protection IP complète (brevets/marques), pacte signé, conformité totale.", en: "Complete IP protection, signed cofounder agreement, full compliance." } }
                ]
            },
            {
                id: 'partnership_readiness', name: 'Partnership readiness', category: 'Partnership readiness', type: 'radio',
                q: { fr: 'Quels partenaires sont nécessaires et quelle valeur concrète pouvez-vous leur offrir ?', en: 'Which partners are needed and what concrete value can you offer them?' },
                options: [
                    { id: 'a', label: { fr: "Aucun partenaire identifié ou attentes irréalistes envers les tiers.", en: "No partners identified or unrealistic expectations from third parties." } },
                    { id: 'b', label: { fr: "Liste de partenaires cibles sans premier contact ni valeur définie.", en: "Target partners identified, but no outreach or clear value defined." } },
                    { id: 'c', label: { fr: "Discussions avancées en cours avec des partenaires clés.", en: "Advanced discussions underway with strategic partners." } },
                    { id: 'd', label: { fr: "Partenariats stratégiques signés apportant distribution ou technologie.", en: "Formal strategic partnerships signed, delivering distribution or tech." } }
                ]
            },
            {
                id: 'scalability', name: 'Scalability', category: 'Scalability', type: 'textarea',
                q: { fr: 'Qu\'est-ce qui doit devenir moins cher, être automatisé ou standardisé pour grandir ?', en: 'What must become cheaper, automated or standardized to grow?' }
            },
            {
                id: 'impact_potential', name: 'Impact potential', category: 'Impact potential', type: 'radio',
                q: { fr: 'Quel changement économique, social ou environnemental mesurable le projet peut-il créer ?', en: 'What measurable economic, social or environmental change could the venture create?' },
                options: [
                    { id: 'a', label: { fr: "Pas de réflexion sur l'impact économique, social ou environnemental.", en: "No consideration of economic, social, or environmental impact." } },
                    { id: 'b', label: { fr: "Intention d'impact expressed mais sans indicateur de mesure précis.", en: "Positive impact intent expressed, but lacks measurable KPIs." } },
                    { id: 'c', label: { fr: "Indicateurs d'impact définis (ex: emplois créés, émission évitée).", en: "Clear impact metrics defined (jobs created, CO2 saved, income)." } },
                    { id: 'd', label: { fr: "Modèle d'impact mesurable, nativement lié à la croissance du CA.", en: "Measurable impact core to business model, scaling with revenue." } }
                ]
            }
        ];

        const MODULES_LIST = [
            { id: 1, month: 1, title: { fr: 'De l’idée à une opportunité validée', en: 'From idea to validated opportunity' } },
            { id: 2, month: 2, title: { fr: 'Construire la venture', en: 'Building the venture' } },
            { id: 3, month: 3, title: { fr: 'Valider le marché', en: 'Validating the market' } },
            { id: 4, month: 4, title: { fr: 'Construire un business durable', en: 'Building a sustainable business' } },
            { id: 5, month: 5, title: { fr: 'Investment & Growth Readiness', en: 'Investment & Growth Readiness' } },
            { id: 6, month: 6, title: { fr: 'Scale & stratégie 2027', en: 'Scale & 2027 strategy' } }
        ];

        const MAX_PTS_FOUNDER = FOUNDER_MCQ_CATALOGUE.length * 5; // 60 pts
        const MAX_PTS_STARTUP = STARTUP_MCQ_CATALOGUE.length * 5; // 70 pts

        function JuryApp() {
            const [lang, setLang] = useState('fr');
            const [isLoading, setIsLoading] = useState(false);
            const [startups, setStartups] = useState([]);
            const [activeModulesMap, setActiveModulesMap] = useState({});

            // Admin State
            const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [passError, setPassError] = useState(false);
            const [adminTab, setAdminTab] = useState('attendance');
            const [selectedModuleId, setSelectedModuleId] = useState(1);
            const [selectedDay, setSelectedDay] = useState('Lundi');

            // Detailed Jury Evaluation State
            const [selectedJuryCandidateId, setSelectedJuryCandidateId] = useState(null);
            const [evalType, setEvalType] = useState('founder');
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [missingScoresModal, setMissingScoresModal] = useState(null);
            const [showSuccessModal, setShowSuccessModal] = useState(false);

            const t = I18N[lang];

            useEffect(() => {
                const saved = localStorage.getItem('candidate_portal_data');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            setStartups(parsed);
                            setSelectedJuryCandidateId(parsed[0].id);
                        }
                    } catch (e) { }
                }
                loadFromBackend();
            }, []);

            useEffect(() => {
                if (startups.length > 0) {
                    localStorage.setItem('candidate_portal_data', JSON.stringify(startups));
                }
            }, [startups]);

            const loadFromBackend = async () => {
                setIsLoading(true);
                try {
                    const res = await fetch(GOOGLE_SCRIPT_URL);
                    const data = await res.json();

                    let candidateList = [];
                    if (data.candidates && Array.isArray(data.candidates)) {
                        candidateList = data.candidates;
                    } else if (Array.isArray(data)) {
                        candidateList = data;
                    }

                    if (candidateList.length > 0) {
                        const formatted = candidateList.map(r => ({
                            id: r.id || r.candidate_id,
                            name: r.startup_name || r.name || 'Projet Sans Nom',
                            founder: r.founder_name || r.founder || 'Fondateur',
                            email: r.email || '',
                            answers: r.answers || {},
                            frequency: r.frequency || 2,
                            selectedDays: r.selectedDays || ['Lundi', 'Mercredi'],
                            timeSlot: r.timeSlot || 'matin',
                            completedModules: r.completedModules || [],
                            totalModules: 12,
                            jury_scores: r.jury_scores || {},
                            dailyAttendance: r.dailyAttendance || {}
                        }));

                        setStartups(formatted);
                        if (!selectedJuryCandidateId) setSelectedJuryCandidateId(formatted[0].id);
                    }

                    if (data.activeModules) {
                        setActiveModulesMap(data.activeModules);
                    }
                } catch (e) {
                    console.warn("Connexion distante indisponible.", e);
                } finally {
                    setIsLoading(false);
                }
            };

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (passwordInput === JURY_PASSWORD) {
                    setIsAdminAuthenticated(true);
                    setPassError(false);
                } else setPassError(true);
            };

            const toggleModuleStatusAdmin = async (moduleId) => {
                const newStatus = !activeModulesMap[moduleId];
                setActiveModulesMap(prev => ({ ...prev, [moduleId]: newStatus }));

                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'update_module_status',
                            moduleId: moduleId,
                            isActive: newStatus
                        })
                    });
                } catch (e) { }
            };

            const handleAttendanceAdmin = async (startupId, status, justification) => {
                const recordKey = `${selectedModuleId}_${selectedDay}`;
                setStartups(prev => prev.map(s => {
                    if (s.id === startupId) {
                        const newDaily = { ...(s.dailyAttendance || {}) };
                        newDaily[recordKey] = { status, justification, timestamp: new Date().toLocaleString() };
                        return { ...s, dailyAttendance: newDaily };
                    }
                    return s;
                }));

                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'update_attendance',
                            candidate_id: startupId,
                            recordKey,
                            status,
                            justification
                        })
                    });
                } catch (e) { }
            };

            const handleJuryScoreChange = (candId, skillId, scoreVal) => {
                setStartups(startups.map(c => {
                    if (c.id === candId) {
                        const jury_scores = { ...(c.jury_scores || {}) };
                        jury_scores[skillId] = parseInt(scoreVal, 10);
                        return { ...c, jury_scores };
                    }
                    return c;
                }));
            };

            const calculateScores = (cand) => {
                if (!cand) return { fObtained: 0, sObtained: 0, fPct: 0, sPct: 0, totalObtained: 0, totalMax: MAX_PTS_FOUNDER + MAX_PTS_STARTUP, globalPct: 0 };

                let fObtained = 0;
                FOUNDER_MCQ_CATALOGUE.forEach(s => {
                    fObtained += (cand.jury_scores?.[s.id] || 0);
                });

                let sObtained = 0;
                STARTUP_MCQ_CATALOGUE.forEach(s => {
                    sObtained += (cand.jury_scores?.[s.id] || 0);
                });

                const fPct = Math.round((fObtained / MAX_PTS_FOUNDER) * 100);
                const sPct = Math.round((sObtained / MAX_PTS_STARTUP) * 100);
                const totalObtained = fObtained + sObtained;
                const totalMax = MAX_PTS_FOUNDER + MAX_PTS_STARTUP;
                const globalPct = Math.round((totalObtained / totalMax) * 100);

                return { fObtained, sObtained, fPct, sPct, totalObtained, totalMax, globalPct };
            };

            const calculateGlobalAttendanceStats = () => {
                let validated = 0;
                let lates = 0;
                let absences = 0;

                startups.forEach(s => {
                    const daily = s.dailyAttendance || {};
                    Object.values(daily).forEach(rec => {
                        if (rec.status === 'present') validated++;
                        else if (rec.status === 'late') lates++;
                        else if (rec.status === 'absent') absences++;
                    });
                });

                const totalRecords = validated + lates + absences;
                const globalRate = totalRecords > 0 ? Math.round((validated / totalRecords) * 100) : 0;

                return { globalRate, validated, lates, absences };
            };

            const handleSubmitJuryScores = async (cand) => {
                const juryScores = cand.jury_scores || {};

                const unratedFounder = FOUNDER_MCQ_CATALOGUE.filter(q => !juryScores[q.id]);
                const unratedStartup = STARTUP_MCQ_CATALOGUE.filter(q => !juryScores[q.id]);

                if (unratedFounder.length > 0 || unratedStartup.length > 0) {
                    setMissingScoresModal({
                        founder: unratedFounder,
                        startup: unratedStartup
                    });
                    if (unratedFounder.length > 0) setEvalType('founder');
                    else if (unratedStartup.length > 0) setEvalType('startup');
                    return;
                }

                setIsSubmitting(true);
                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'update_jury_scores',
                            candidate_id: cand.id,
                            jury_scores: juryScores
                        })
                    });
                    setIsSubmitting(false);
                    setShowSuccessModal(true);
                } catch (err) {
                    setIsSubmitting(false);
                    alert(t.submitError);
                }
            };

            const handleExportExcel = () => {
                if (typeof XLSX === 'undefined') return;
                const overview = startups.map(c => {
                    const sc = calculateScores(c);
                    return {
                        ID: c.id,
                        Startup: c.name,
                        Fondateur: c.founder,
                        Email: c.email,
                        "Note Fondateur": `${sc.fObtained} / ${MAX_PTS_FOUNDER} (${sc.fPct}%)`,
                        "Note Startup": `${sc.sObtained} / ${MAX_PTS_STARTUP} (${sc.sPct}%)`,
                        "Score Global": `${sc.totalObtained} / ${sc.totalMax} (${sc.globalPct}%)`
                    };
                });
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(overview), "Rapport Notation Jury");
                XLSX.writeFile(wb, "Rapport_Jury_Incubateur.xlsx");
            };

            const attendanceGlobalStats = calculateGlobalAttendanceStats();

            return (
                <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900 pb-12">
                    <header className="bg-slate-900 text-white px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4 shadow-lg">
                        <div>
                            <h1 className="text-xl font-bold">{t.appTitleAdmin}</h1>
                            <p className="text-xs text-slate-400">{t.appSubtitle}</p>
                        </div>

                        <div className="flex flex-wrap items-center gap-3">
                            <button onClick={loadFromBackend} disabled={isLoading} className="bg-slate-800 text-white text-xs px-3 py-1.5 rounded-lg border border-slate-700 font-bold">
                                {isLoading ? '...' : t.refreshBtn}
                            </button>

                            <div className="bg-slate-800 p-1 rounded-lg border border-slate-700 text-xs font-bold space-x-1">
                                <button onClick={() => setLang('fr')} className={`px-2 py-1 rounded ${lang === 'fr' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>FR</button>
                                <button onClick={() => setLang('en')} className={`px-2 py-1 rounded ${lang === 'en' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>EN</button>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 p-6 max-w-7xl mx-auto w-full space-y-6">
                        {!isAdminAuthenticated ? (
                            <div className="bg-slate-900 flex items-center justify-center p-8 rounded-2xl">
                                <div className="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl space-y-6">
                                    <div className="text-center space-y-2">
                                        <div className="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-2xl font-bold mx-auto">🔒</div>
                                        <h2 className="text-2xl font-extrabold text-slate-900">{t.authTitle}</h2>
                                        <p className="text-xs text-slate-500">{t.authSubtitle}</p>
                                    </div>
                                    <form onSubmit={handleAdminLogin} className="space-y-4">
                                        <input
                                            type="password"
                                            value={passwordInput}
                                            onChange={e => setPasswordInput(e.target.value)}
                                            placeholder={t.passPlaceholder}
                                            className="w-full border p-3 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500"
                                        />
                                        {passError && <p className="text-xs font-bold text-rose-600 text-center">{t.passErrorMsg}</p>}
                                        <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl text-xs font-bold shadow-lg transition">
                                            {t.unlockBtn}
                                        </button>
                                    </form>
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-6">
                                <div className="bg-white p-2 rounded-2xl border flex justify-between items-center shadow-sm">
                                    <div className="flex space-x-2">
                                        <button
                                            onClick={() => setAdminTab('attendance')}
                                            className={`px-4 py-2 rounded-xl text-xs font-bold transition ${adminTab === 'attendance' ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600'}`}
                                        >
                                            {t.tabAttendance}
                                        </button>
                                        <button
                                            onClick={() => setAdminTab('attendance_stats')}
                                            className={`px-4 py-2 rounded-xl text-xs font-bold transition ${adminTab === 'attendance_stats' ? 'bg-sky-600 text-white' : 'bg-slate-100 text-slate-600'}`}
                                        >
                                            {t.tabAttendanceStats}
                                        </button>
                                        <button
                                            onClick={() => setAdminTab('modules')}
                                            className={`px-4 py-2 rounded-xl text-xs font-bold transition ${adminTab === 'modules' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}`}
                                        >
                                            {t.tabModules}
                                        </button>
                                        <button
                                            onClick={() => setAdminTab('jury')}
                                            className={`px-4 py-2 rounded-xl text-xs font-bold transition ${adminTab === 'jury' ? 'bg-amber-600 text-white' : 'bg-slate-100 text-slate-600'}`}
                                        >
                                            {t.tabJury}
                                        </button>
                                    </div>

                                    <button onClick={() => setIsAdminAuthenticated(false)} className="bg-rose-950 text-rose-300 text-xs px-3 py-2 rounded-lg font-bold border border-rose-800">
                                        {t.lockBtn}
                                    </button>
                                </div>

                                {adminTab === 'modules' && (
                                    <div className="bg-white p-6 rounded-2xl border space-y-4">
                                        <div>
                                            <h3 className="font-extrabold text-slate-900 text-lg">{t.moduleActivationTitle}</h3>
                                            <p className="text-xs text-slate-500">{t.moduleActivationSub}</p>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            {MODULES_LIST.map(m => {
                                                const isActive = !!activeModulesMap[m.id];
                                                return (
                                                    <div key={m.id} className="p-4 rounded-xl border flex justify-between items-center bg-slate-50">
                                                        <div>
                                                            <span className="text-xs font-bold text-indigo-600">{t.moduleWord} {m.id} ({t.monthLabel} {m.month})</span>
                                                            <h4 className="text-sm font-bold text-slate-900">{m.title[lang]}</h4>
                                                        </div>
                                                        <button
                                                            onClick={() => toggleModuleStatusAdmin(m.id)}
                                                            className={`px-4 py-2 rounded-xl text-xs font-bold transition shadow ${isActive ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-600'}`}
                                                        >
                                                            {isActive ? t.unlockedStatus : t.lockedStatus}
                                                        </button>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}

                                {adminTab === 'attendance' && (
                                    <div className="bg-white p-6 rounded-2xl border space-y-6">
                                        <div className="flex flex-col md:flex-row justify-between md:items-center border-b pb-4 gap-4">
                                            <div>
                                                <h3 className="font-extrabold text-slate-900 text-lg">{t.registerTitle}</h3>
                                                <p className="text-xs text-slate-500">{t.registerSub}</p>
                                            </div>
                                            <div className="flex space-x-3">
                                                <select value={selectedModuleId} onChange={e => setSelectedModuleId(Number(e.target.value))} className="bg-indigo-50 border border-indigo-200 text-indigo-900 text-xs font-bold p-2 rounded-xl">
                                                    {MODULES_LIST.map(m => <option key={m.id} value={m.id}>M{m.id} - {m.title[lang]}</option>)}
                                                </select>
                                                <select value={selectedDay} onChange={e => setSelectedDay(e.target.value)} className="bg-amber-50 border border-amber-200 text-amber-900 text-xs font-bold p-2 rounded-xl">
                                                    {DAYS_MAP.map((d, i) => <option key={d} value={d}>{DAYS_OF_WEEK[lang][i]}</option>)}
                                                </select>
                                            </div>
                                        </div>

                                        <div className="space-y-4">
                                            {startups.map(s => {
                                                const recKey = `${selectedModuleId}_${selectedDay}`;
                                                const att = s.dailyAttendance?.[recKey] || { status: 'none', justification: '' };
                                                const isDayInInitialChoice = (s.selectedDays || []).includes(selectedDay);

                                                return (
                                                    <div key={s.id} className={`p-4 rounded-xl border flex flex-col md:flex-row justify-between items-start md:items-center gap-3 ${isDayInInitialChoice ? 'bg-slate-50' : 'bg-amber-50/50 border-amber-200'}`}>
                                                        <div>
                                                            <div className="flex items-center space-x-2">
                                                                <h4 className="font-bold text-slate-900">{s.name}</h4>
                                                                <span className="text-xs text-slate-500">({s.founder})</span>

                                                                {!isDayInInitialChoice && (
                                                                    <span className="bg-amber-200 text-amber-900 text-[10px] font-extrabold px-2 py-0.5 rounded-full border border-amber-300">
                                                                        {t.outsideChoice}
                                                                    </span>
                                                                )}
                                                            </div>
                                                            <p className="text-xs text-slate-500 mt-1">
                                                                {t.slotWord} : <span className="font-semibold">{s.timeSlot || 'matin'}</span> | {t.chosenDaysWord} : <span className="font-semibold">{(s.selectedDays || []).join(', ')}</span>
                                                            </p>
                                                        </div>

                                                        <div className="flex items-center space-x-2 w-full md:w-auto justify-end">
                                                            <button onClick={() => handleAttendanceAdmin(s.id, 'present', att.justification)} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${att.status === 'present' ? 'bg-emerald-600 text-white' : 'bg-white border'}`}>{t.presentBtn}</button>
                                                            <button onClick={() => handleAttendanceAdmin(s.id, 'late', att.justification)} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${att.status === 'late' ? 'bg-amber-500 text-white' : 'bg-white border'}`}>{t.lateBtn}</button>
                                                            <button onClick={() => handleAttendanceAdmin(s.id, 'absent', att.justification)} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${att.status === 'absent' ? 'bg-rose-600 text-white' : 'bg-white border'}`}>{t.absentBtn}</button>
                                                            {(att.status === 'absent' || att.status === 'late') && (
                                                                <input type="text" placeholder={t.reasonPlaceholder} value={att.justification || ''} onChange={e => handleAttendanceAdmin(s.id, att.status, e.target.value)} className="border p-1.5 rounded text-xs bg-white" />
                                                            )}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}

                                {adminTab === 'attendance_stats' && (
                                    <div className="bg-white p-6 rounded-2xl border space-y-6">
                                        <div className="border-b pb-4">
                                            <h3 className="font-extrabold text-slate-900 text-lg">{t.statsTitle}</h3>
                                            <p className="text-xs text-slate-500">{t.statsSub}</p>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                            <div className="bg-indigo-50 border border-indigo-200 p-4 rounded-xl text-center">
                                                <p className="text-xs font-bold text-indigo-700 uppercase">{t.statGlobalRate}</p>
                                                <p className="text-3xl font-extrabold text-indigo-900 mt-1">{attendanceGlobalStats.globalRate}%</p>
                                            </div>
                                            <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-xl text-center">
                                                <p className="text-xs font-bold text-emerald-700 uppercase">{t.statValidated}</p>
                                                <p className="text-3xl font-extrabold text-emerald-900 mt-1">{attendanceGlobalStats.validated}</p>
                                            </div>
                                            <div className="bg-amber-50 border border-amber-200 p-4 rounded-xl text-center">
                                                <p className="text-xs font-bold text-amber-700 uppercase">{t.statLates}</p>
                                                <p className="text-3xl font-extrabold text-amber-900 mt-1">{attendanceGlobalStats.lates}</p>
                                            </div>
                                            <div className="bg-rose-50 border border-rose-200 p-4 rounded-xl text-center">
                                                <p className="text-xs font-bold text-rose-700 uppercase">{t.statAbsences}</p>
                                                <p className="text-3xl font-extrabold text-rose-900 mt-1">{attendanceGlobalStats.absences}</p>
                                            </div>
                                        </div>

                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left border-collapse text-xs">
                                                <thead>
                                                    <tr className="bg-slate-100 border-b text-slate-700 uppercase text-[10px] tracking-wider">
                                                        <th className="p-3">{t.colStartup}</th>
                                                        <th className="p-3">{t.colFounder}</th>
                                                        <th className="p-3">{t.colFreq}</th>
                                                        <th className="p-3">{t.colSlot}</th>
                                                        <th className="p-3 text-center">{t.colModules}</th>
                                                        <th className="p-3">{t.colHistory}</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100">
                                                    {startups.map(s => {
                                                        const daily = s.dailyAttendance || {};
                                                        const records = Object.entries(daily);

                                                        return (
                                                            <tr key={s.id} className="hover:bg-slate-50">
                                                                <td className="p-3 font-bold text-slate-900">{s.name}</td>
                                                                <td className="p-3 text-slate-600">{s.founder}</td>
                                                                <td className="p-3 font-semibold text-slate-700">{s.frequency} {t.timesPerWeek}</td>
                                                                <td className="p-3 capitalize font-semibold text-indigo-700">{s.timeSlot || 'matin'}</td>

                                                                <td className="p-3">
                                                                    <div className="flex space-x-1 justify-center">
                                                                        {MODULES_LIST.map(m => {
                                                                            let st = null;
                                                                            Object.keys(daily).forEach(key => {
                                                                                if (key.startsWith(`${m.id}_`)) {
                                                                                    st = daily[key]?.status;
                                                                                }
                                                                            });

                                                                            const isCandidateCompleted = (s.completedModules || []).includes(m.id);

                                                                            let color = 'bg-slate-200 text-slate-400';
                                                                            if (st === 'present') color = 'bg-emerald-500 text-white';
                                                                            else if (st === 'late') color = 'bg-amber-500 text-white';
                                                                            else if (st === 'absent') color = 'bg-rose-500 text-white';
                                                                            else if (isCandidateCompleted) color = 'bg-indigo-500 text-white';

                                                                            return (
                                                                                <span key={m.id} title={`M${m.id}: ${st || (isCandidateCompleted ? 'Validé candidat' : t.unmarked)}`} className={`w-5 h-5 rounded flex items-center justify-center font-bold text-[9px] ${color}`}>
                                                                                    {m.id}
                                                                                </span>
                                                                            );
                                                                        })}
                                                                    </div>
                                                                </td>

                                                                <td className="p-3">
                                                                    {records.length === 0 ? (
                                                                        <span className="text-slate-400 italic text-[11px]">{t.unmarked}</span>
                                                                    ) : (
                                                                        <div className="flex flex-wrap gap-1">
                                                                            {records.map(([key, item]) => {
                                                                                const badgeClass = item.status === 'present'
                                                                                    ? 'bg-emerald-100 text-emerald-800 border-emerald-300'
                                                                                    : item.status === 'late'
                                                                                        ? 'bg-amber-100 text-amber-800 border-amber-300'
                                                                                        : 'bg-rose-100 text-rose-800 border-rose-300';

                                                                                return (
                                                                                    <span key={key} className={`text-[10px] px-2 py-0.5 rounded border font-bold ${badgeClass}`} title={item.justification || ''}>
                                                                                        {key.replace('_', ' ')} : {item.status}
                                                                                    </span>
                                                                                );
                                                                            })}
                                                                        </div>
                                                                    )}
                                                                </td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}

                                {adminTab === 'jury' && (
                                    <div className="space-y-6">
                                        <div className="flex justify-between items-center border-b pb-2">
                                            <h2 className="text-xs font-bold text-slate-500 uppercase">{t.candidatesTitle} ({startups.length})</h2>
                                            <button onClick={handleExportExcel} className="bg-emerald-600 text-white text-xs px-3 py-1.5 rounded-lg font-bold">
                                                {t.exportBtn}
                                            </button>
                                        </div>

                                        <div className="flex space-x-2 overflow-x-auto pb-2">
                                            {startups.length === 0 ? (
                                                <div className="text-xs text-slate-400 bg-white p-3 rounded-xl border italic">
                                                    {t.noCandidates}
                                                </div>
                                            ) : (
                                                startups.map(c => (
                                                    <button
                                                        key={c.id}
                                                        onClick={() => setSelectedJuryCandidateId(c.id)}
                                                        className={`px-4 py-2.5 rounded-xl text-xs font-bold transition border flex items-center space-x-2 ${selectedJuryCandidateId === c.id ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-100'}`}
                                                    >
                                                        <span>{c.name}</span>
                                                        <span className="opacity-60 font-normal">({c.founder})</span>
                                                    </button>
                                                ))
                                            )}
                                        </div>

                                        {selectedJuryCandidateId ? (() => {
                                            const cand = startups.find(c => c.id === selectedJuryCandidateId);
                                            if (!cand) return null;

                                            const sc = calculateScores(cand);
                                            const activeCatalogue = evalType === 'founder' ? FOUNDER_MCQ_CATALOGUE : STARTUP_MCQ_CATALOGUE;

                                            return (
                                                <div className="space-y-6">
                                                    <div className="bg-slate-900 text-white p-6 rounded-2xl shadow-xl grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
                                                        <div>
                                                            <span className="text-xs bg-indigo-500/30 text-indigo-300 font-bold px-2.5 py-1 rounded-full uppercase">{t.dossierLabel}</span>
                                                            <h2 className="text-2xl font-extrabold mt-2">{cand.name}</h2>
                                                            <p className="text-xs text-slate-400 mt-1">{t.founderLabel} : {cand.founder} | {cand.email}</p>
                                                        </div>

                                                        <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-2 text-xs">
                                                            <div className="flex justify-between">
                                                                <span className="text-indigo-300 font-bold">{t.scoreFounder} :</span>
                                                                <span className="font-extrabold">{sc.fObtained} / {MAX_PTS_FOUNDER} pts ({sc.fPct}%)</span>
                                                            </div>
                                                            <div className="w-full bg-slate-700 rounded-full h-2">
                                                                <div className="bg-indigo-500 h-2 rounded-full transition-all" style={{ width: `${sc.fPct}%` }}></div>
                                                            </div>

                                                            <div className="flex justify-between pt-1">
                                                                <span className="text-emerald-300 font-bold">{t.scoreStartup} :</span>
                                                                <span className="font-extrabold">{sc.sObtained} / {MAX_PTS_STARTUP} pts ({sc.sPct}%)</span>
                                                            </div>
                                                            <div className="w-full bg-slate-700 rounded-full h-2">
                                                                <div className="bg-emerald-500 h-2 rounded-full transition-all" style={{ width: `${sc.sPct}%` }}></div>
                                                            </div>
                                                        </div>

                                                        <div className="bg-indigo-950 p-4 rounded-xl border border-indigo-800 text-center">
                                                            <p className="text-xs text-indigo-300 font-bold uppercase">{t.globalMaturity}</p>
                                                            <p className="text-3xl font-extrabold mt-1">{sc.totalObtained} <span className="text-sm font-normal text-slate-400">/ {sc.totalMax} pts</span></p>
                                                            <p className="text-xs text-emerald-400 font-bold mt-1">{sc.globalPct}% {t.advancement}</p>
                                                        </div>
                                                    </div>

                                                    <div className="flex bg-white p-1.5 rounded-xl border border-slate-200">
                                                        <button
                                                            onClick={() => setEvalType('founder')}
                                                            className={`flex-1 py-3 rounded-lg text-xs font-bold transition ${evalType === 'founder' ? 'bg-indigo-600 text-white shadow' : 'text-slate-600 hover:bg-slate-50'}`}
                                                        >
                                                            {t.founderTab}
                                                        </button>
                                                        <button
                                                            onClick={() => setEvalType('startup')}
                                                            className={`flex-1 py-3 rounded-lg text-xs font-bold transition ${evalType === 'startup' ? 'bg-emerald-600 text-white shadow' : 'text-slate-600 hover:bg-slate-50'}`}
                                                        >
                                                            {t.startupTab}
                                                        </button>
                                                    </div>

                                                    <div className="space-y-6">
                                                        {activeCatalogue.map((mcq, idx) => {
                                                            const answerData = cand.answers?.[mcq.id] || {};
                                                            const juryScore = cand.jury_scores?.[mcq.id] || 0;
                                                            const catStyle = CATEGORY_STYLES[mcq.category] || 'bg-slate-100 text-slate-700 border-slate-200';

                                                            return (
                                                                <div key={mcq.id} className={`bg-white p-6 rounded-2xl border shadow-sm space-y-4 transition ${!juryScore ? 'border-amber-300 ring-1 ring-amber-100' : 'border-slate-200'}`}>
                                                                    <div className="flex justify-between items-start border-b pb-3">
                                                                        <div>
                                                                            <div className="flex items-center space-x-2">
                                                                                <span className="text-xs font-bold text-slate-400">Q{idx + 1}.</span>
                                                                                <h4 className="font-bold text-slate-900 text-base">{mcq.name}</h4>
                                                                                <span className={`text-[11px] px-2.5 py-0.5 rounded-full font-semibold border ${catStyle}`}>
                                                                                    {mcq.category}
                                                                                </span>
                                                                            </div>
                                                                            <p className="text-xs text-indigo-700 font-medium italic mt-1">"{mcq.q[lang]}"</p>
                                                                        </div>

                                                                        <span className={`text-xs font-bold px-3 py-1.5 rounded-lg border ${juryScore ? 'bg-indigo-50 text-indigo-700 border-indigo-100' : 'bg-rose-50 text-rose-600 border-rose-200'}`}>
                                                                            {t.scoreJury} {juryScore ? `${juryScore} / 5 pts` : 'Non noté'}
                                                                        </span>
                                                                    </div>

                                                                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 text-xs">
                                                                        <span className="font-bold text-slate-500 uppercase tracking-wide">{t.candidateAnswer}</span>
                                                                        <div className="mt-2 text-slate-900 font-medium">
                                                                            {(() => {
                                                                                if (mcq.type === 'textarea') {
                                                                                    return answerData.textAnswer ? (
                                                                                        <p className="whitespace-pre-wrap bg-white p-3 rounded-lg border">{answerData.textAnswer}</p>
                                                                                    ) : <i className="text-slate-400">{t.noTextAnswer}</i>;
                                                                                }
                                                                                if (mcq.type === 'radio_other' && answerData.selectedOption === 'other') {
                                                                                    return <p className="bg-white p-3 rounded-lg border">{answerData.otherText || <i className="text-slate-400">{t.noOptionAnswer}</i>}</p>;
                                                                                }
                                                                                if (mcq.type === 'checkbox') {
                                                                                    const sel = (answerData.selectedCheckbox || []).map(id => {
                                                                                        const o = mcq.options.find(opt => opt.id === id);
                                                                                        return o ? o.label[lang] : id;
                                                                                    });
                                                                                    return sel.length > 0 ? (
                                                                                        <ul className="list-disc pl-5 space-y-1 bg-white p-3 rounded-lg border">
                                                                                            {sel.map((s, i) => <li key={i}>{s}</li>)}
                                                                                        </ul>
                                                                                    ) : <i className="text-slate-400">{t.noCheckboxAnswer}</i>;
                                                                                }
                                                                                if (answerData.selectedOption) {
                                                                                    const opt = mcq.options.find(o => o.id === answerData.selectedOption);
                                                                                    return (
                                                                                        <p className="bg-white p-3 rounded-lg border">
                                                                                            {opt ? (opt.label ? opt.label[lang] : opt.title[lang]) : answerData.selectedOption}
                                                                                        </p>
                                                                                    );
                                                                                }
                                                                                return <i className="text-slate-400">{t.noRadioAnswer}</i>;
                                                                            })()}
                                                                        </div>
                                                                    </div>

                                                                    <div className="bg-indigo-50/70 p-4 rounded-xl border border-indigo-100 flex flex-col md:flex-row md:items-center justify-between gap-3">
                                                                        <span className="text-xs font-bold text-indigo-950">{t.assignScore}</span>
                                                                        <div className="flex items-center space-x-2">
                                                                            {[1, 2, 3, 4, 5].map((score) => (
                                                                                <button
                                                                                    key={score}
                                                                                    onClick={() => handleJuryScoreChange(cand.id, mcq.id, score)}
                                                                                    className={`w-10 h-10 rounded-xl font-extrabold text-xs transition border ${juryScore === score
                                                                                        ? 'bg-indigo-600 text-white border-indigo-600 shadow-md scale-105'
                                                                                        : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'
                                                                                        }`}
                                                                                >
                                                                                    {score}
                                                                                </button>
                                                                            ))}
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>

                                                    <div className="pt-4 flex justify-end">
                                                        <button
                                                            disabled={isSubmitting}
                                                            onClick={() => handleSubmitJuryScores(cand)}
                                                            className="bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-400 text-white font-bold text-sm px-8 py-4 rounded-xl shadow-lg transition flex items-center space-x-2"
                                                        >
                                                            {isSubmitting ? (
                                                                <span>⏳ {t.submittingBtn}</span>
                                                            ) : (
                                                                <span>✓ {t.submitJuryBtn}</span>
                                                            )}
                                                        </button>
                                                    </div>
                                                </div>
                                            );
                                        })() : (
                                            <div className="bg-white p-12 rounded-2xl border text-center text-slate-400 text-xs">
                                                {t.noSelectionPrompt}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {missingScoresModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-4 border border-rose-100">
                                <div className="flex items-center space-x-3 text-rose-600">
                                    <div className="bg-rose-100 p-3 rounded-xl font-bold text-xl">⚠</div>
                                    <div>
                                        <h3 className="font-bold text-slate-900 text-lg">{t.missingScoresTitle}</h3>
                                        <p className="text-xs text-slate-500 mt-0.5">{t.missingScoresMsg}</p>
                                    </div>
                                </div>

                                <div className="max-h-60 overflow-y-auto space-y-3 bg-slate-50 p-3 rounded-xl border text-xs">
                                    {missingScoresModal.founder.length > 0 && (
                                        <div>
                                            <p className="font-bold text-indigo-700 mb-1">{t.missingFounder} ({missingScoresModal.founder.length}) :</p>
                                            <ul className="list-disc pl-5 text-slate-700 space-y-0.5">
                                                {missingScoresModal.founder.map(q => <li key={q.id}>{q.name}</li>)}
                                            </ul>
                                        </div>
                                    )}

                                    {missingScoresModal.startup.length > 0 && (
                                        <div className="mt-2">
                                            <p className="font-bold text-emerald-700 mb-1">{t.missingStartup} ({missingScoresModal.startup.length}) :</p>
                                            <ul className="list-disc pl-5 text-slate-700 space-y-0.5">
                                                {missingScoresModal.startup.map(q => <li key={q.id}>{q.name}</li>)}
                                            </ul>
                                        </div>
                                    )}
                                </div>

                                <button
                                    onClick={() => setMissingScoresModal(null)}
                                    className="w-full bg-slate-900 text-white py-3 rounded-xl text-xs font-bold transition"
                                >
                                    {t.closeBtn}
                                </button>
                            </div>
                        </div>
                    )}

                    {showSuccessModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl text-center space-y-4 border border-emerald-100">
                                <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl font-bold mx-auto">
                                    ✓
                                </div>
                                <h3 className="font-extrabold text-slate-900 text-xl">{t.submittedSuccess}</h3>
                                <button
                                    onClick={() => setShowSuccessModal(false)}
                                    className="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl text-xs font-bold shadow-lg transition"
                                >
                                    OK
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<JuryApp />);
    </script>
</body>

</html>
